# fly.toml for Convivium. Secrets (QLOO_API_KEY, GROQ_API_KEY, PUBLIC_URL) are set with `fly secrets set`.
# One always-on machine with a volume: SQLite lives on it, and the calendar watcher must keep running.

app = 'convivium'
primary_region = 'ams'

[build]

[env]
  CONVIVIUM_DB = '/data/convivium.db'
  QLOO_BASE = 'https://hackathon.api.qloo.com'
  LLM_MODEL = 'groq:openai/gpt-oss-120b'
  WATCH_INTERVAL_SECONDS = '900'
  SEED_DEMO = '1'
  AUTO_RUN_GAP_SECONDS = '60'

[[mounts]]
  source = 'convivium_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
